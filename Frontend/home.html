            <button class="lang-btn">
                <img alt="Deutsch" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATOBzxI46an1geCuml5ahKhPMH2AOdI1-nqJTiVVVPCC_XzpIe-PR8Pqgqio_KyDUSlAzQIYzkOn2SXzyw7TL1QNWrli2jiMFZS_tClaxE0x4maoG2soinyUOqRCjUfWaSEi5TzV6zuH8loT5H78Nbi-9nqCQCcCjsbREdTdea_ZxzuKOIGc9xf-UpCnQ9sDl32CLirILYGIqkM-2gv6PQ9AqWw9qtMbuS3WAlDMATmCJyBKE-BdTI1Y9adXhWkfnggkLMJePq0aM"/>

    <main class="hero-main">
        <span class="material-icons background-icon">restaurant_menu</span>

        <button class="start-order-btn">
            <span class="material-icons icon">touch_app</span>
            <span class="title font-display">Rendelés Indítása</span>
            <span class="subtitle">Koppints a kezdéshez</span>
        </button>
    </main>

    <footer class="home-footer">
        
        <div class="promo-banner">
            <div class="promo-badge">ÚJ!</div>
            <img alt="Pizza promóció" class="promo-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCswu68B6rwCXJ6DE9F7ReG6Fu3ZDALYC5vPEqTzHHXWsAzOWd49-B3nI1dgF7GYc8LSFveIqniYUqF8SXaPYErr5RwidHajpciO_vyjXca1Y_jbRGb9d7yhhrUTBL7EzTgFIIdze6lBXuvnmAyBZcjL0-a20Te9Or4V8U07KLGeBAvdPxnwjCGahBb_as7rwNNqO1IPpSeoRxsbK7WLpjksJibjsgmtJnHv8AGoJoeW08yMCVxI2DE-Mt47vcEa7ihN8DcPnJZjYM"/>

                <p>Próbálja ki új, fatüzelésű kemencében sült pizzáinkat extra sajttal!</p>

        <div class="help-section">
