<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Étlap Kategóriák</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
</head>
<body>
    <header class="page-header">
        <button class="back-btn brown">
            <span class="material-icons">arrow_back</span> Vissza
        </button>
    </header>

    <main class="categories-main">
        <div class="page-title-box">
            <h1 class="font-display">Étlap</h1>
        </div>

        <div class="category-grid">
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">local_pizza</span>
                    <span>Pizza</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">lunch_dining</span>
                    <span>Burger</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">local_bar</span>
                    <span>Ital</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">icecream</span>
                    <span>Desszert</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">emoji_nature</span>
                    <span>Saláta</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">soup_kitchen</span>
                    <span>Leves</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">dinner_dining</span>
                    <span>Tészta</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">outdoor_grill</span>
                    <span>Grill</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">set_meal</span>
                    <span>Hal</span>
                </div>
            </button>
            <button class="category-card">
                <div class="category-content">
                    <span class="material-icons">eco</span>
                    <span>Vegán</span>
                </div>
            </button>
        </div>
    </main>

    <button class="floating-help-btn" aria-label="Segítség">
        <span class="material-icons">help_outline</span>
    </button>
    <script src="categories.js"></script>
</body>
</html>
